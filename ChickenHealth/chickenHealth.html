<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/ChickenHealth/chickenHealth.css" />
    <title>Chicken Health</title>
  </head>
  <body>
    <nav>
      <div class="linkHolder">
        <a href="/">Home</a>
      </div>
    </nav>

    <h1>Chicken Health at Level</h1>

    <div class="inputLevel">
      <p>Enter Level:</p>
      <input type="text" id="chickenLevel" placeholder="(e.g. 2000 or 2k)" />
    </div>

    <div class="btn">
      <button id="EnterBtn">Enter</button>
    </div>

    <article id="results">
      <p>Health: <span id="healthValue"></span></p>
    </article>

    <script src="/ChickenHealth/chickenHealth.js"></script>
  </body>
</html>
